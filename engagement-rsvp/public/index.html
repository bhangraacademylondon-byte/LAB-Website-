<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="{{BACKGROUND}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>:root { {{THEME_CSS}} }</style>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand" data-link id="brand">&nbsp;</a>
      <button class="text-size" id="text-size" type="button" aria-pressed="false">
        <span aria-hidden="true">A<span class="big-a">A</span></span> <span class="text-size-label">Larger text</span>
      </button>
      <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>Menu</span>
      </button>
    </div>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul id="nav-list"></ul>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <div class="page-loading"><div class="spinner" aria-label="Loading"></div></div>
  </main>

  <footer class="site-footer" id="footer"></footer>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <noscript><p class="container">Please turn on JavaScript to use this website.</p></noscript>
</body>
</html>
