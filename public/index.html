<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{SITE_NAME}}</title>
  <meta name="description" content="{{SITE_DESCRIPTION}}">
  <meta name="theme-color" content="{{THEME_COLOR}}">
  <meta property="og:title" content="{{SITE_NAME}}">
  <meta property="og:description" content="{{SITE_DESCRIPTION}}">
  <meta property="og:image" content="/img/og-backdrop.jpg">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/img/favicon-48.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preload" href="/fonts/archivo/archivo-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/home.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div id="announcement" class="announcement" hidden></div>

  <header class="hdr" id="hdr">
    <div class="hdr-main">
      <a href="/" class="lab-logo" id="brand" aria-label="Home">
        <img src="/img/logo.png" alt="" id="brand-logo" width="58" height="58">
        <span><b id="brand-short">LAB</b><small id="brand-name">{{SITE_NAME}}</small></span>
      </a>
      <nav class="mnav" aria-label="Main navigation">
        <span class="mnav-links" id="mnav-links"></span>
        <a class="call-btn" id="call-btn" href="#" hidden aria-label="Call us"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2"/></svg></a>
        <button class="menu-btn" id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-panel" aria-label="Open menu"><span class="burger" aria-hidden="true"><i></i><i></i><i></i></span><span class="lbl">Menu</span></button>
      </nav>
      <div class="hdr-cta" id="hdr-cta"></div>
    </div>
    <div class="menu-panel" id="menu-panel"><div class="menu-inner" id="menu-inner"></div></div>
  </header>

  <main id="main" tabindex="-1">
    <div class="page-loading"><div class="spinner" aria-label="Loading"></div></div>
  </main>

  <div class="ticker" id="ticker" hidden></div>
  <footer class="site-foot" id="footer"></footer>

  <a id="scan-fab" class="btn btn-accent scan-fab" href="/admin/scanner" hidden>📷 Scan QR</a>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <noscript><p class="container">Please enable JavaScript to use this site.</p></noscript>
</body>
</html>
