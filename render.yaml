# Render Blueprint (free plan): https://render.com/docs/blueprint-spec
# The data lives in Supabase (free plan), so this service needs no disk.
# In Render: New → Blueprint → pick this repository, then fill in the values
# marked "sync: false" when asked (see README → "Free hosting: Render + Supabase").
services:
  - type: web
    name: london-academy-of-bhangra
    runtime: node
    region: frankfurt # closest Render region to London
    plan: free
    branch: claude/bhangra-academy-webapp-8rnqlh
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL # Supabase → Connect → Session pooler connection string
        sync: false
      - key: SUPABASE_URL # Supabase → Project Settings → API → Project URL
        sync: false
      - key: SUPABASE_SERVICE_KEY # Supabase → Project Settings → API Keys → secret / service_role key
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY # Resend → API Keys (sending access). Switches on emails: contact alerts, password resets, email checks
        sync: false
      - key: DATABASE_CA_CERT # Optional: Supabase → Database settings → SSL certificate, to fully verify the database connection
        sync: false
